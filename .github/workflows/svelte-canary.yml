name: svelte canary

# Early warning for the hand-rolled parser (src/template-parse/): svelte
# ships new template syntax in minor releases (<svelte:boundary> in 5.3,
# {@attach} in 5.29), so this runs the shim compare, unit tests, and the
# differential fuzzer against the newest svelte@latest, ahead of the
# lockfile pin. The npm `next` dist-tag is stale (pre-5.0), so `latest`
# is the real frontier. Scheduled and manual only; never blocks PRs.

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Upgrade to the newest svelte
        run: |
          bun add --dev svelte@latest
          echo "svelte version:"
          grep '"version"' node_modules/svelte/package.json

      - name: Parser shim compare
        run: bun test svelte-template-parse-shim

      - name: Full unit tests
        run: bun run test

      - name: Differential fuzz
        run: bun run fuzz --iterations 300

      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="svelte canary failed"
          BODY="The svelte canary workflow failed.

          This usually means a new svelte release changed template syntax
          that src/template-parse/ does not yet handle (or shifted output
          in a way the shim compare/fuzzer caught). See
          .github/workflows/svelte-canary.yml for context.

          Failed run: ${RUN_URL}"

          existing=$(gh issue list --repo "${{ github.repository }}" \
            --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n1)

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
